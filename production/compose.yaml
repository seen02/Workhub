# 배포 이름. 기존 데이터 볼륨을 계속 사용하려면 운영 중에는 같은 이름을 유지함.
name: ${COMPOSE_PROJECT_NAME:-custom-outline}

services:
  # 1. Outline Database (PostgreSQL) - 문서·사용자·컬렉션 데이터 저장
  outline-db:
    image: ${OUTLINE_POSTGRES_IMAGE} # .env에서 사용할 PostgreSQL 이미지와 버전 지정
    restart: unless-stopped # 수동으로 중지한 경우를 제외하고 종료 후 자동 재시작
    environment:
      # DB 최초 생성 시 사용할 계정과 데이터베이스. Outline의 DATABASE_URL과 일치해야 함.
      POSTGRES_USER: outline
      POSTGRES_DB: outline
      POSTGRES_PASSWORD: ${OUTLINE_DB_PASSWORD}
    volumes:
      # 컨테이너를 재생성해도 DB 보존. 현재 PostgreSQL 18 이미지의 저장 경로에 맞춘 설정임.
      - outline-db:/var/lib/postgresql
    healthcheck:
      # DB가 접속을 받을 준비가 끝난 후 Outline을 실행하기 위한 상태 확인
      test: ["CMD-SHELL", "pg_isready -U outline -d outline"]
      interval: 5s # 5초마다 검사
      timeout: 5s # 검사 한 번의 최대 대기 시간
      retries: 30 # 연속 30회 실패하면 unhealthy로 표시
    networks:
      - internal # 같은 네트워크의 컨테이너에서 outline-db:5432로 접속

  # 2. Outline Cache / Queue (Redis) - 캐시·작업 큐·실시간 처리 지원
  outline-redis:
    image: ${REDIS_IMAGE}
    restart: unless-stopped
    # Redis 변경 내역을 AOF 파일에 기록하여 재시작 시 복구에 사용함.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - outline-redis:/data # Redis 저장 파일 보존
    healthcheck:
      test: ["CMD", "redis-cli", "ping"] # Redis 응답 확인
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - internal

  # 3. Authentik Database (PostgreSQL) - 계정·그룹·로그인 공급자 설정 저장
  authentik-db:
    image: ${AUTHENTIK_POSTGRES_IMAGE}
    restart: unless-stopped
    environment:
      # 인증 데이터는 Outline 문서 DB와 분리함. Authentik 서버·워커가 이 DB를 공유함.
      POSTGRES_USER: authentik
      POSTGRES_DB: authentik
      POSTGRES_PASSWORD: ${AUTHENTIK_DB_PASSWORD}
    volumes:
      # 현재 PostgreSQL 16 이미지의 데이터 경로. Outline DB와 주 버전·경로가 다름.
      - authentik-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authentik -d authentik"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - internal

  # 4. Authentik Server (SSO / OIDC) - 로그인 화면·사용자 인증·관리자 API 제공
  authentik-server:
    image: ${AUTHENTIK_IMAGE}
    restart: unless-stopped
    command: ["server"] # 같은 Authentik 이미지에서 웹 서버 역할 실행
    environment:
      # 서명·암호화용 비밀키. 워커와 같은 값을 사용하고 운영 중에는 유지함.
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}

      # 인증 DB 연결. localhost 대신 Docker 서비스 이름으로 접속함.
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD}

      # 외부 오류 보고 전송 비활성화
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
    depends_on:
      authentik-db:
        condition: service_healthy # DB 상태 검사가 통과한 뒤 시작
    volumes:
      - authentik-data:/data # 서버와 워커가 공유하는 파일 데이터
    networks:
      - internal

  # 5. Authentik Worker - 인증 관련 백그라운드 작업·최초 관리자 설정 처리
  authentik-worker:
    image: ${AUTHENTIK_IMAGE}
    restart: unless-stopped
    command: ["worker"] # 웹 서버와 별도 프로세스로 백그라운드 작업 실행
    environment:
      # 서버와 동일한 비밀키 및 DB를 사용해야 같은 인증 환경으로 동작함.
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"

      # 최초 설치 시 관리자 계정과 설정 자동화용 API 토큰 생성
      # 이미 생성된 관리자 비밀번호는 이 값만 바꿔도 변경되지 않음.
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL}
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD}
      AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN}
    depends_on:
      authentik-db:
        condition: service_healthy
    volumes:
      - authentik-data:/data # Authentik 서버와 같은 볼륨 공유
    networks:
      - internal

  # 6. Outline (Main Application) - 문서 협업 화면·서버 및 커스텀 업무 화면
  outline:
    image: ${OUTLINE_IMAGE} # 빌드한 커스텀 이미지에 사용할 이름과 버전
    build:
      context: . # 이 폴더의 소스를 빌드에 사용
      dockerfile: docker/Dockerfile.outline # 커스텀 Outline 빌드 절차
    restart: unless-stopped
    environment:
      # 프로젝트·통계·업무 생성·칸반 기능 사용 여부. Workhub와 같은 값으로 설정함.
      # ${변수:-기본값}은 .env 값이 없거나 비어 있을 때 기본값을 사용함.
      OUTLINE_PROJECT_MANAGEMENT_ENABLED: ${OUTLINE_PROJECT_MANAGEMENT_ENABLED:-true}
      OUTLINE_ANALYTICS_ENABLED: ${OUTLINE_ANALYTICS_ENABLED:-true}
      OUTLINE_TASK_CREATION_ENABLED: ${OUTLINE_TASK_CREATION_ENABLED:-true}
      OUTLINE_KANBAN_ENABLED: ${OUTLINE_KANBAN_ENABLED:-true}

      # 서버 실행 설정
      NODE_ENV: production # Node.js 운영 모드
      PORT: "3000" # 컨테이너 내부 API·웹 포트. Nginx가 이 포트로 요청 전달
      WEB_CONCURRENCY: "1" # 웹 서버 프로세스 수
      URL: http://${OUTLINE_DOMAIN}:${HTTP_PORT} # 사용자 접속 주소. VM 추가 설정에서 공개 포트로 변경

      # 문서 DB 및 Redis 연결. Docker 내부 통신이므로 호스트에 포트를 공개할 필요가 없음.
      DATABASE_URL: postgres://outline:${OUTLINE_DB_PASSWORD}@outline-db:5432/outline
      PGSSLMODE: disable # 내부 PostgreSQL 연결에 TLS 미사용
      REDIS_URL: redis://outline-redis:6379

      # 암호화·서명용 키와 내부 예약 작업 API 검증용 키
      SECRET_KEY: ${OUTLINE_SECRET_KEY}
      UTILS_SECRET: ${OUTLINE_UTILS_SECRET}

      # 첨부파일을 로컬 볼륨에 저장함. 실제 경로는 아래 volumes와 일치해야 함.
      FILE_STORAGE: local
      FILE_STORAGE_LOCAL_ROOT_DIR: /var/lib/outline/data
      FILE_STORAGE_UPLOAD_MAX_SIZE: ${FILE_STORAGE_UPLOAD_MAX_SIZE:-52428800} # 기본 50 MiB. Nginx 제한도 함께 확인

      # 현재 HTTP 프록시 구성에 맞춰 앱 자체 HTTPS 강제 전환과 업데이트 확인을 끔.
      FORCE_HTTPS: "false"
      ENABLE_UPDATES: "false"

      # Authentik OIDC 로그인 설정. 클라이언트 ID·비밀값은 Authentik 공급자 설정과 일치해야 함.
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_AUTH_URI: http://${AUTH_DOMAIN}:${HTTP_PORT}/application/o/authorize/ # 브라우저가 이동할 로그인 주소
      OIDC_TOKEN_URI: http://${AUTH_DOMAIN}:${HTTP_PORT}/application/o/token/ # 서버가 인증 코드를 토큰으로 교환
      OIDC_USERINFO_URI: http://${AUTH_DOMAIN}:${HTTP_PORT}/application/o/userinfo/ # 로그인 사용자 정보 조회
      OIDC_LOGOUT_URI: http://${AUTH_DOMAIN}:${HTTP_PORT}/application/o/custom-outline/end-session/ # 인증 세션 종료
      OIDC_SCOPES: openid email profile work_groups # 사용자 식별·이메일·프로필·커스텀 그룹 정보 요청
      OIDC_DISPLAY_NAME: Custom Outline login # 로그인 화면의 버튼 표시 이름

      # 업무 API 연결. 공유 비밀값은 Workhub와 일치해야 내부 요청을 검증할 수 있음.
      WORKHUB_INTERNAL_URL: http://workhub:8000 # Docker 내부 통신용
      OUTLINE_WORKHUB_BRIDGE_SECRET: ${OUTLINE_WORKHUB_BRIDGE_SECRET}
    volumes:
      - outline-files:/var/lib/outline/data # 컨테이너 재생성 후에도 첨부파일 보존
    depends_on:
      outline-db:
        condition: service_healthy
      outline-redis:
        condition: service_healthy
      authentik-server:
        condition: service_started # 컨테이너 시작만 대기. 로그인 API 준비 완료까지 보장하지는 않음.
    healthcheck:
      # Outline의 상태 확인 API가 정상 HTTP 응답을 반환하는지 검사함.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/_health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 10s
      start_period: 120s # 최초 기동·DB 마이그레이션 시간을 고려한 초기 실패 유예
      retries: 10
    networks:
      - internal

  # 7. Workhub (Business API) - 프로젝트·업무·칸반·통계 처리
  workhub:
    image: ${WORKHUB_IMAGE}
    build:
      context: .
      dockerfile: docker/Dockerfile.workhub
    restart: unless-stopped
    environment:
      # Outline 화면과 Workhub API에서 동일한 기능을 활성화함.
      OUTLINE_PROJECT_MANAGEMENT_ENABLED: ${OUTLINE_PROJECT_MANAGEMENT_ENABLED:-true}
      OUTLINE_ANALYTICS_ENABLED: ${OUTLINE_ANALYTICS_ENABLED:-true}
      OUTLINE_TASK_CREATION_ENABLED: ${OUTLINE_TASK_CREATION_ENABLED:-true}
      OUTLINE_KANBAN_ENABLED: ${OUTLINE_KANBAN_ENABLED:-true}

      # Outline 연동. 내부 API 주소와 사용자에게 보여 줄 공개 링크 주소를 구분함.
      OUTLINE_URL: http://outline:3000 # Docker 내부 API 호출용
      OUTLINE_PUBLIC_URL: http://${OUTLINE_DOMAIN}:${HTTP_PORT} # 사용자에게 제공할 문서 링크용
      # 초기 워크스페이스 생성 후 configure.py connect-outline로 API 키와 워크스페이스 ID 설정
      OUTLINE_API_KEY: ${OUTLINE_API_KEY:-}
      OUTLINE_WORKHUB_TEAM_ID: ${OUTLINE_WORKHUB_TEAM_ID:-}
      OUTLINE_WORKHUB_BRIDGE_SECRET: ${OUTLINE_WORKHUB_BRIDGE_SECRET} # Outline과 같은 공유 비밀값

      # Authentik의 사용자·그룹을 조회하여 업무 계정 동기화에 사용함.
      AUTHENTIK_API_URL: http://authentik-server:9000
      AUTHENTIK_DIRECTORY_TOKEN: ${AUTHENTIK_DIRECTORY_TOKEN}

      # 업무 데이터를 SQLite 파일로 저장함. 볼륨 안에 두어 재시작 후에도 보존함.
      WORKHUB_DB: /app/data/workhub.sqlite3
    volumes:
      - workhub-data:/app/data
    depends_on:
      outline:
        condition: service_started
      authentik-server:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
    # 외부 공개 포트 없이 Outline이 internal 네트워크로 API 호출
    networks:
      - internal

  # 8. Reverse Proxy (Nginx) - 사용자 요청을 받아 Outline 또는 Authentik으로 전달
  reverse-proxy:
    image: ${NGINX_IMAGE}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT}:${HTTP_PORT}" # 호스트 포트:컨테이너 포트. 사용자는 이 진입점으로 접속
    environment:
      # Nginx 템플릿에 넣을 수신 포트·도메인·요청 전달 대상
      HTTP_PORT: ${HTTP_PORT}
      OUTLINE_DOMAIN: ${OUTLINE_DOMAIN}
      AUTH_DOMAIN: ${AUTH_DOMAIN}
      OUTLINE_UPSTREAM: outline:3000 # 문서 서비스의 내부 주소
      # 지정한 환경변수만 치환하여 $host·$scheme 같은 Nginx 자체 변수 보존
      NGINX_ENVSUBST_FILTER: "^(HTTP_PORT|OUTLINE_DOMAIN|AUTH_DOMAIN|OUTLINE_UPSTREAM)$"
    volumes:
      # 시작 시 환경변수를 치환해 실제 Nginx 설정 생성. :ro는 읽기 전용 연결임.
      - ./config/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      authentik-server:
        condition: service_started
    networks:
      internal:
        # 컨테이너 안에서도 공개 도메인으로 Nginx에 접속할 수 있게 함(OIDC 서버 간 요청 등).
        # 사용자 PC의 DNS 설정과는 별개임.
        aliases:
          - ${OUTLINE_DOMAIN}
          - ${AUTH_DOMAIN}

# 데이터 영구 저장소. 컨테이너를 재생성해도 유지되며 docker compose down -v 실행 시 삭제됨.
volumes:
  outline-db: {} # Outline PostgreSQL 데이터
  outline-redis: {} # Redis 영속화 데이터
  authentik-db: {} # Authentik PostgreSQL 데이터
  authentik-data: {} # Authentik 서버·워커 공유 파일
  outline-files: {} # 문서 첨부파일
  workhub-data: {} # Workhub SQLite 업무 데이터

# 컨테이너 간 통신망. internal은 이름이며 외부 통신 차단 옵션을 뜻하지 않음.
networks:
  internal:
    driver: bridge # 한 Docker 호스트 안에서 서비스 이름으로 서로 통신
