# Local HTTP only. Real deployment requires TLS and matching SSO URLs.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
log_format workhub '$remote_addr $host $request_method $uri $status $request_time';
access_log /dev/stdout workhub;
resolver 127.0.0.11 valid=10s ipv6=off;
server_tokens off;
server { listen 80 default_server; server_name _; return 404; }
server { listen 8004; server_name _; return 302 http://workhub.test$request_uri; }
server {
    listen 80;
    server_name workhub.test;
    location ^~ /internal/outline-projects/ { return 404; }
    location ^~ /internal/outline-search/ { return 404; }
    location ^~ /internal/outline-analytics/ { return 404; }
    location ^~ /internal/outline-tasks/ { return 404; }
    location ^~ /internal/outline-kanban/ { return 404; }
    client_max_body_size 250m;
    client_body_timeout 120s;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    location / {
        set $backend "workhub:8000";
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}
server { listen 3000; server_name _; return 302 http://rocketchat.workhub.test$request_uri; }
server {
    listen 80;
    server_name rocketchat.workhub.test;
    # WORKHUB_LOCAL_UUID_COMPAT: remove when this environment moves to HTTPS.
    location = /__workhub_local/crypto-compat.js {
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        return 200 '/* Local HTTP demo only. Production deployments must use HTTPS.
 * RoomHistoryManager needs UUID v4 even when randomUUID is unavailable.
 * Keep native implementations and use the browser CSPRNG; no weak fallback.
 */
(function () {
  "use strict";
  if (location.protocol !== "http:" || location.hostname !== "rocketchat.workhub.test") return;
  var crypto = globalThis.crypto;
  if (!crypto || typeof crypto.randomUUID === "function" || typeof crypto.getRandomValues !== "function") return;
  Object.defineProperty(crypto, "randomUUID", {
    configurable: true,
    writable: true,
    value: function randomUUID() {
      var bytes = new Uint8Array(16);
      crypto.getRandomValues(bytes);
      bytes[6] = (bytes[6] & 15) | 64;
      bytes[8] = (bytes[8] & 63) | 128;
      var hex = Array.from(bytes, function (b) { return b.toString(16).padStart(2, "0"); }).join("");
      return hex.slice(0, 8) + "-" + hex.slice(8, 12) + "-" + hex.slice(12, 16) + "-" + hex.slice(16, 20) + "-" + hex.slice(20);
    }
  });
})();
';
    }

    client_max_body_size 250m;
    client_body_timeout 120s;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    location / {
        proxy_set_header Accept-Encoding "";
        sub_filter_once on;
        sub_filter '<head>' '<head><script src="/__workhub_local/crypto-compat.js"></script>';

        set $backend "rocketchat:3000";
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}
